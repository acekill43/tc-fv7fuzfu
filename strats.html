<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Comps · Strats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1923; --panel:#16222e; --panel2:#1c2a37; --line:#2a3a49;

  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;font-size:15px;line-height:1.55}
  a{color:inherit}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:#0b131b;position:sticky;top:0;z-index:50}
  header h1{margin:0;font:700 22px Oswald,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  header h1 span{color:var(--red)}
  .nav{display:flex;gap:4px;margin-left:8px}
  .nav a{text-decoration:none;font:600 13px Inter;color:var(--muted);padding:7px 12px;border-radius:6px;border:1px solid transparent}
  .nav a:hover{color:var(--text)}
  .nav a.on{color:var(--text);background:var(--panel2);border-color:var(--line)}
  .spacer{flex:1}
  .meta{font-size:12px;color:var(--muted)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 22px 0;max-width:1240px;margin:0 auto}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 16px;font:700 15px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}
  .tab:hover{color:var(--text)}
  .tab.on{color:#fff;background:var(--red);border-color:var(--red)}

  main{max-width:1240px;margin:0 auto;padding:16px 22px 60px}
  .hero{position:relative;border-radius:12px;overflow:hidden;background:var(--panel2) center/cover no-repeat;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 24px}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,25,35,.95) 25%,rgba(15,25,35,.45))}
  .hero > *{position:relative}
  .hero h2{margin:0;font:700 44px/1 Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .hero p{margin:8px 0 0;color:#c9d1d9;max-width:720px}

  h3{font:700 16px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px}
  .comp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative}
  .card .pl{font:700 15px Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .face{width:84px;height:84px;border-radius:10px;overflow:hidden;position:relative;background:var(--panel2);border-bottom:3px solid var(--rc)}
  .face img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
  .face .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px Oswald,sans-serif;color:var(--rc)}
  .card .ag{font-weight:600}
  .card .role{font-size:12px;color:var(--rc)}
  .badge{font-size:11px;border-radius:99px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
  .badge.chg{border-color:var(--amber);color:var(--amber)}
  .badge.keep{border-color:#2f5e45;color:var(--green)}
  .card .job{font-size:12.5px;color:#c9d1d9;line-height:1.4;margin-top:2px}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
  .btn:hover{border-color:var(--muted)}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}
  .small{font-size:12.5px;color:var(--muted)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .box h4{margin:0 0 8px;font:700 15px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .box ul,.box ol{margin:0;padding-left:20px}
  .box li{margin:4px 0}
  .box.flaws{border-color:#5a2a30;background:#1d1519}
  .box.flaws h4{color:var(--red)}
  .box.alt{border-color:#4a3c22}
  .box.alt h4{color:var(--amber)}
  b.p{color:#fff}
  .tag{display:inline-block;font:700 11px Inter;padding:1px 7px;border-radius:4px;margin-right:6px;vertical-align:1px}
  .tag.atk{background:#3a1d22;color:#ff8a95}
  .tag.def{background:#16303a;color:#7dd3f0}
  table.pos{width:100%;border-collapse:collapse;font-size:14px}
  table.pos td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
  table.pos td:first-child{white-space:nowrap;font-weight:600;width:1%}
  textarea.notes{width:100%;min-height:110px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px Inter,sans-serif;resize:vertical}
  .sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .sync i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}

  .overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:14px}
  .ov{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .ov .ini{font-size:16px}
  .ov h4{margin:0 0 6px;font:700 15px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .sources{font-size:12.5px;color:var(--muted);margin-top:36px;border-top:1px solid var(--line);padding-top:14px}
  .sources a{color:#9fb3c8}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
  .toast.show{opacity:1}
  @media (max-width:900px){ .comp{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} .hero h2{font-size:32px} }

  .gate{position:fixed;inset:0;z-index:1000;background:rgba(10,16,23,.97);display:flex;align-items:center;justify-content:center}
  .gate .gbox{background:#16222e;border:1px solid #2a3a49;border-radius:12px;padding:28px;width:min(420px,92vw);text-align:center}
  .gate h2{margin:0 0 6px;font:700 24px Oswald,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .gate p{margin:0 0 16px;color:#8b9aa8;font-size:14px}
  .gate input{width:100%;background:#0f1923;border:1px solid #2a3a49;color:#ece8e1;border-radius:8px;padding:11px 12px;font:600 16px Inter,sans-serif;text-align:center;letter-spacing:.1em}
  .gate button{margin-top:12px;width:100%;background:#ff4655;border:0;color:#fff;border-radius:8px;padding:11px;font:600 14px Inter,sans-serif;cursor:pointer}
  .gate .gerr{color:#ff4655;font-size:13px;min-height:18px;margin-top:10px}
  .codebtn{background:none;border:0;color:#8b9aa8;font:500 12px Inter,sans-serif;cursor:pointer;text-decoration:underline}
</style>
</head>

const CODE_KEY = "vcp_team_code";
const TEAM = (() => { try{ return (localStorage.getItem(CODE_KEY) || "").trim(); }catch(e){ return ""; } })();
const ROOT = "teams/" + TEAM;
function showGate(){
  const g = document.createElement("div");
  g.className = "gate";
  g.innerHTML = `<div class="gbox"><h2>Team code</h2><p>Enter the code your team gave you. You only need to do this once on this device.</p>
    <input id="gateIn" autocomplete="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx"><button id="gateBtn">Unlock</button><div class="gerr" id="gateErr"></div></div>`;
  document.body.appendChild(g);
  const inp = g.querySelector("#gateIn"), err = g.querySelector("#gateErr");
  const go = async () => {
    const code = inp.value.trim().toLowerCase();
    if(!/^[a-z0-9-]{6,40}$/.test(code)){ err.textContent = "That doesn't look like a team code."; return; }
    err.textContent = "Checking…";
    try{
      const pl = await fetch(`${DATABASE_URL.replace(/\/+$/,"")}/teams/${code}/players.json`).then(r => r.ok ? r.json() : null);
      if(!pl){ err.textContent = "Wrong code."; return; }
      try{ localStorage.setItem(CODE_KEY, code); }catch(e){}
      location.reload();
    }catch(e){ err.textContent = "Couldn't reach the database. Check your internet."; }
  };
  g.querySelector("#gateBtn").onclick = go;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  setTimeout(() => inp.focus(), 50);
}
function forgetCode(){ try{ localStorage.removeItem(CODE_KEY); }catch(e){} location.reload(); }

const ORDER = ["Abyss","Bind","Haven","Corrode","Sunset","Lotus","Summit"];

/* ---------------- render ---------------- */
let players = [...PLAYERS];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function face(key){
  const a = AG[key], rc = `var(--${a[1]})`;
  return `<div class="face" style="--rc:${rc}"><div class="ini">${a[0].slice(0,2).toUpperCase()}</div><img src="${M}/agents/${a[2]}/displayicon.png" alt="" onerror="this.remove()"></div>`;
}
function tabs(cur){
  document.getElementById("tabs").innerHTML =
    `<a class="tab ${cur==="overview"?"on":""}" href="#overview">Overview</a>` +
    ORDER.map(m => `<a class="tab ${cur===m?"on":""}" href="#${m.toLowerCase()}">${m}</a>`).join("");
}
function renderOverview(){
  const changes = ORDER.map(m => STRATS[m].comp.filter(c => c[0]!==c[1]).length);
  document.getElementById("main").innerHTML = `
    <div class="hero" style="background-image:url('${M}/maps/${MAPIMG.Summit}/listviewicon.png')">
      <h2>Team playbook</h2>
      <p>Recommended comps for every map, built from the agents each of you already put on the Board, with the current pro meta (patch 13.09) and a plan to follow on attack and defence.</p>
    </div>
    <h3>The big problems on our board</h3>
    <div class="grid2">
      <div class="box flaws"><h4>What's going wrong</h4><ul>
        <li><b>One controller on every map.</b> Pros run two on Abyss, Bind, Lotus and Corrode.</li>
        <li><b>Double duelist with no info</b> on Bind, Lotus, Summit and Sunset. Sunset had <b>zero</b> initiators.</li>
        <li><b>Nobody plays Viper</b> except GOAT, and she's in 3 of our 7 best comps.</li>
        <li><b>Summit needs two sentinels</b> to hold the walls. We had one.</li>
      </ul></div>
      <div class="box"><h4>What's already right</h4><ul>
        <li>Haven is basically the pro comp.</li>
        <li>Corrode was 4/5 correct (just swap Neon → Omen).</li>
        <li>Abyss already had the pro duelist pair (Yoru + Waylay) and Sova.</li>
        <li>michael's Omen is the most-picked agent in pro play, so keep him on it.</li>
      </ul></div>
    </div>
    <h3>Every change uses an agent you already listed</h3>
    <div class="overview">${ORDER.map((m,i) => `
      <a class="ov" href="#${m.toLowerCase()}" style="text-decoration:none">
        <h4>${m} <span class="badge ${changes[i]?"chg":"keep"}" style="margin-left:6px">${changes[i]?changes[i]+" change"+(changes[i]>1?"s":""):"keep"}</span></h4>
        <div style="display:flex;gap:6px;margin-top:8px">${STRATS[m].comp.map(c => `<div style="width:48px;text-align:center">${face(c[0]).replace('class="face"','class="face" style="width:48px;height:48px;--rc:var(--'+AG[c[0]][1]+')"')}</div>`).join("")}</div>
      </a>`).join("")}
    </div>
    <h3>Who plays what</h3>
    <div class="box"><table class="pos">
      <tr><td></td>${ORDER.map(m=>`<td style="font-weight:600">${m}</td>`).join("")}</tr>
      ${players.map((p,i)=>`<tr><td>${esc(p)}</td>${ORDER.map(m=>`<td>${AG[STRATS[m].comp[i][0]][0]}</td>`).join("")}</tr>`).join("")}
    </table></div>
    ${sources()}`;
}
function renderMap(m){
  const s = STRATS[m];
  document.getElementById("main").innerHTML = `
    <div class="hero" style="background-image:url('${M}/maps/${MAPIMG[m]}/listviewicon.png')">
      <h2>${m}</h2><p>${s.tagline}</p>
    </div>
    <h3>Recommended comp</h3>
    <div class="comp">${s.comp.map((c,i) => {
      const a = AG[c[0]], changed = c[0]!==c[1];
      return `<div class="card" style="--rc:var(--${a[1]})">
        <div class="pl">${esc(players[i])}</div>${face(c[0])}
        <div class="ag">${a[0]}</div><div class="role">${a[1]}</div>
        <span class="badge ${changed?"chg":"keep"}">${changed?"was "+(AG[c[1]]?AG[c[1]][0]:c[1]):"no change"}</span>
        <div class="job">${c[2]}</div></div>`;
    }).join("")}</div>
    <div class="row">
      <button class="btn red" id="applyBtn">Put this comp on the Board</button>
      <span class="small">Makes these each player's main on ${m}. Nothing gets removed, so your other agents stay as extras.</span>
    </div>
    <h3>Flaws we found</h3>
    <div class="grid2">
      <div class="box flaws"><h4>Before → after</h4><ul>${s.flaws.map(f=>`<li>${f}</li>`).join("")}</ul></div>
      <div class="box alt"><h4>Backup option</h4><p style="margin:0">${s.alt}</p></div>
    </div>
    <h3><span class="tag atk">ATTACK</span>Game plan</h3>
    <div class="box"><ul>${s.attack.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <h3><span class="tag def">DEFENCE</span>Setup</h3>
    <div class="box"><table class="pos">${s.defense.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>
    <h3>Remember</h3>
    <div class="box"><ul>${s.keys.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <h3>Team notes <span class="sync" id="noteSync"><i></i>loading</span></h3>
    <textarea class="notes" id="notes" placeholder="Add your own calls, lineups, what worked in last night's games… saves for everyone."></textarea>
    ${sources()}`;
  document.getElementById("applyBtn").onclick = () => applyComp(m);
  loadNotes(m);
}
function sources(){
  return `<div class="sources">Sources: pro pick rates from VCT Champions 2026 (Bind and Corrode from Champions 2025) via
    <a href="https://gametree.me/blog/best-agents-for-each-valorant-map/" target="_blank" rel="noopener">GameTree</a> and
    <a href="https://www.valorant-spind.de/en/valorant-agenten-pickrates.html" target="_blank" rel="noopener">valorant-spind</a>.
    Summit win rates from <a href="https://metabot.gg/en/valorant/map/Summit/overview" target="_blank" rel="noopener">metabot.gg</a>,
    Summit walls and setups from <a href="https://valorantmaps.gg/summit" target="_blank" rel="noopener">valorantmaps.gg</a>,
    tier data from <a href="https://valking.gg/en/agents" target="_blank" rel="noopener">valking.gg</a>.
    Use this as a starting playbook and change what doesn't work in your games.</div>`;
}

/* ---------------- shared data: notes + "apply to board" ---------------- */
let noteTimer = null, noteES = null;
function setNoteSync(t, c){ const el = document.getElementById("noteSync"); if(el) el.innerHTML = `<i style="background:${c}"></i>${t}`; }
function loadNotes(m){
  const ta = document.getElementById("notes");
  if(noteES){ noteES.close(); noteES = null; }
  if(!DB){ setNoteSync("no database", "#8b9aa8"); return; }
  if(!TEAM){ setNoteSync("locked", "#8b9aa8"); return; }
  noteES = new EventSource(`${DB}/${ROOT}/notes/${m}.json`);
  noteES.addEventListener("put", e => {
    const msg = JSON.parse(e.data);
    if(document.activeElement !== ta && msg.path === "/") ta.value = msg.data || "";
    setNoteSync("saved for everyone", "#6fcf97");
  });
  noteES.onerror = () => setNoteSync("offline", "#ff4655");
  ta.addEventListener("input", () => {
    setNoteSync("saving…", "#f2c48a");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      fetch(`${DB}/${ROOT}/notes/${m}.json`, {method:"PUT", body:JSON.stringify(ta.value)})
        .then(r => { if(!r.ok) throw 0; setNoteSync("saved for everyone", "#6fcf97"); })
        .catch(() => setNoteSync("couldn't save", "#ff4655"));
    }, 600);
  });
}
let applyArmed = null;
async function applyComp(m){
  const btn = document.getElementById("applyBtn");
  if(applyArmed !== m){ applyArmed = m; btn.textContent = "Click again to confirm"; setTimeout(()=>{ if(applyArmed===m){ applyArmed=null; btn.textContent="Put this comp on the Board"; } }, 3000); return; }
  applyArmed = null; btn.disabled = true; btn.textContent = "Saving…";
  try{
    const cur = await fetch(`${DB}/${ROOT}/cells/${m}.json`).then(r => r.json()) || {};
    const upd = {};
    STRATS[m].comp.forEach((c,i) => {
      const raw = cur[i]; const list = !raw ? [] : Array.isArray(raw) ? raw.filter(Boolean) : Object.keys(raw).sort((a,b)=>a-b).map(k=>raw[k]).filter(Boolean);
      upd[`cells/${m}/${i}`] = [c[0], ...list.filter(k => k !== c[0])];
    });
    const r = await fetch(`${DB}/${ROOT}.json`, {method:"PATCH", body:JSON.stringify(upd)});
    if(!r.ok) throw 0;
    toast(`${m} comp is now the main pick on the Board`);
    btn.textContent = "Done ✓";
  }catch(e){ toast("Couldn't reach the database"); btn.disabled = false; btn.textContent = "Put this comp on the Board"; }
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2200); }

/* player names come from the Board so renames show up here */
if(DB && TEAM) fetch(`${DB}/${ROOT}/players.json`).then(r=>r.json()).then(pl => {
  if(pl){ players = players.map((d,i) => (pl[i] && String(pl[i])) || d); route(); }
}).catch(()=>{});

function route(){
  const h = (location.hash || "#overview").slice(1).toLowerCase();
  const m = ORDER.find(x => x.toLowerCase() === h);
  if(noteES && !m){ noteES.close(); noteES = null; }
  tabs(m || "overview");
  m ? renderMap(m) : renderOverview();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
